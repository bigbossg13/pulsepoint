# Rebuilds the map data from FTCScout + the FTC Events API and deploys the
# site to GitHub Pages.
#
# - Scheduled (every 6 hours) and manual runs rebuild all data.
# - Pushes that only change the site (public/, docs, workflows) reuse the data
#   already published on the live site, so they deploy in a couple of minutes.
# - Pushes that change the data pipeline (lib/, scripts/, package files)
#   rebuild the data.
name: Build data & deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The very first full run geocodes every location at 1 request/second.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Decide whether to rebuild data
        id: mode
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          mode=full
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
             && git cat-file -e "$BEFORE" 2>/dev/null \
             && ! git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(lib/|scripts/|package(-lock)?\.json$)'; then
            mode=reuse
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Data mode: $mode"

      - name: Reuse data from the live site
        id: reuse
        if: steps.mode.outputs.mode == 'reuse'
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p public/data
          curl -fsSL "$BASE_URL/data/seasons.json" -o public/data/seasons.json
          for season in $(node -e 'console.log(require("./public/data/seasons.json").seasons.join(" "))'); do
            curl -fsSL "$BASE_URL/data/$season.json" -o "public/data/$season.json"
          done
          ls -la public/data

      - name: Restore geocode cache
        if: steps.mode.outputs.mode == 'full' || steps.reuse.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: data/geocache.json
          key: geocache-${{ github.run_id }}
          restore-keys: geocache-

      - name: Build data (current + previous season)
        if: steps.mode.outputs.mode == 'full' || steps.reuse.outcome == 'failure'
        env:
          FTC_EVENTS_USERNAME: ${{ secrets.FTC_EVENTS_USERNAME }}
          FTC_EVENTS_TOKEN: ${{ secrets.FTC_EVENTS_TOKEN }}
        run: |
          rm -f public/data/*.json
          current=$(node -e 'const d=new Date();console.log(d.getUTCMonth()>=8?d.getUTCFullYear():d.getUTCFullYear()-1)')
          npm run build-data -- --season "$current"
          npm run build-data -- --season "$((current - 1))"

      - name: Save geocode cache
        if: always() && (steps.mode.outputs.mode == 'full' || steps.reuse.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: data/geocache.json
          key: geocache-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
