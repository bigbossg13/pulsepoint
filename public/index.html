<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PulsePoint FTC Map</title>
  <meta name="description" content="Interactive world map of FIRST Tech Challenge teams and events, powered by FTCScout and the FTC Events API.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36' fill='none'%3E%3Crect width='36' height='36' rx='8' fill='%23fff'/%3E%3Cpath d='M24.5 6.74A13 13 0 1 1 11.5 6.74' stroke='%2315171C' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M20.5 3 11 19h6.5l-2 11.5L25 14.5h-6.5z' fill='%2315171C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar" class="sidebar" aria-label="Map controls">
    <div class="brand">
      <svg class="logo" width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M25.8 4.49A15.6 15.6 0 1 1 10.2 4.49" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M21 0 9.6 19.2h7.8L15 33l11.4-19.2h-7.8z" fill="currentColor"/></svg>
      <div class="brand-text">
        <h1>PulsePoint</h1>
        <p>Every FTC team and event, on one map</p>
      </div>
      <label class="season">
        <span>Season</span>
        <select id="season"></select>
      </label>
      <button id="sidebar-close" class="icon-btn only-mobile" type="button" aria-label="Close filters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="sidebar-body">
      <div class="field search only-desktop">
        <label for="search">Find a team, city or event</label>
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Team number, name, city or event" autocomplete="off">
          <kbd>/</kbd>
        </div>
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>

      <div class="grid-2">
        <label class="field">
          <span>Country</span>
          <select id="country"><option value="">All countries</option></select>
        </label>
        <label class="field">
          <span>State / province</span>
          <select id="state" disabled><option value="">All</option></select>
        </label>
      </div>

      <section class="group">
        <div class="group-head">
          <span>Color teams by</span>
          <label class="check"><input type="checkbox" id="show-teams" checked> Show on map</label>
        </div>
        <div id="color-by" class="segmented" role="group" aria-label="Color teams by">
          <button type="button" data-color="opr" aria-pressed="true">OPR rank</button>
          <button type="button" data-color="rookie" aria-pressed="false">Experience</button>
          <button type="button" data-color="none" aria-pressed="false">Plain</button>
        </div>
        <label class="check"><input type="checkbox" id="only-stats"> Only teams that have played matches</label>
      </section>

      <section class="group">
        <div class="group-head">
          <span>Events</span>
          <label class="check"><input type="checkbox" id="show-events" checked> Show on map</label>
        </div>
        <div id="status-filters" class="chips" role="group" aria-label="Event status"></div>
        <div id="category-filters" class="tags" role="group" aria-label="Event type"></div>
      </section>

      <section id="summary" class="summary" aria-live="polite"></section>

      <p class="credits">
        Data from <a href="https://ftcscout.org" target="_blank" rel="noopener">FTCScout</a> and the
        <a href="https://ftc-events.firstinspires.org/services/API" target="_blank" rel="noopener">FTC Events API</a>.
        Team locations are city-level.<span id="generated"></span>
      </p>
    </div>
  </aside>

  <main class="map-wrap">
    <div id="map" aria-label="Map of FTC teams and events"></div>

    <div class="mobile-bar only-mobile">
      <div class="search-box">
        <svg class="logo" width="24" height="24" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M25.8 4.49A15.6 15.6 0 1 1 10.2 4.49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M21 0 9.6 19.2h7.8L15 33l11.4-19.2h-7.8z" fill="currentColor"/></svg>
        <label class="sr-only" for="search-m">Search teams, cities and events</label>
        <input id="search-m" type="search" placeholder="Search teams, cities, events" autocomplete="off">
      </div>
      <button id="sidebar-open" class="filter-btn" type="button" aria-label="Filters" aria-controls="sidebar" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
      <ul id="search-results-m" class="search-results" role="listbox" hidden></ul>
    </div>

    <div id="stats-pill" class="stats-pill" aria-live="polite"></div>
    <div id="legend" class="legend" aria-label="Legend"></div>
    <section id="details" class="details" aria-label="Selection details" hidden></section>
    <div id="loading" class="loading" role="status">Loading map data…</div>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
