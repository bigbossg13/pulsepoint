<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PulsePoint FTC Map</title>
  <meta name="description" content="Interactive world map of FIRST Tech Challenge teams and events, powered by FTCScout and the FTC Events API.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232e6fd8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar" class="sidebar" aria-label="Map controls">
    <header class="brand">
      <div>
        <h1>PulsePoint</h1>
        <p class="tagline">FTC teams &amp; events around the world</p>
      </div>
      <button id="sidebar-toggle" class="icon-btn only-mobile" aria-expanded="true" aria-controls="sidebar-body" title="Toggle panel">☰</button>
    </header>

    <div id="sidebar-body" class="sidebar-body">
      <section class="controls">
        <label class="field">
          <span>Season</span>
          <select id="season"></select>
        </label>

        <div class="field search">
          <span>Search</span>
          <input id="search" type="search" placeholder="Team number, team or event name" autocomplete="off">
          <ul id="search-results" class="search-results" role="listbox" hidden></ul>
        </div>

        <div class="row">
          <label class="field">
            <span>Country</span>
            <select id="country"><option value="">All countries</option></select>
          </label>
          <label class="field">
            <span>State / province</span>
            <select id="state" disabled><option value="">All</option></select>
          </label>
        </div>

        <fieldset class="group">
          <legend>
            <label class="toggle"><input type="checkbox" id="show-teams" checked> Teams</label>
          </legend>
          <label class="field">
            <span>Color by</span>
            <select id="color-by">
              <option value="opr">Season OPR (world rank)</option>
              <option value="rookie">Team experience</option>
              <option value="none">Single color</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="only-stats"> Only teams that have played matches</label>
        </fieldset>

        <fieldset class="group">
          <legend>
            <label class="toggle"><input type="checkbox" id="show-events" checked> Events</label>
          </legend>
          <div id="status-filters" class="chips" role="group" aria-label="Event status"></div>
          <div id="category-filters" class="checks"></div>
        </fieldset>
      </section>

      <section id="summary" class="summary" aria-live="polite"></section>
      <section id="details" class="details" hidden></section>

      <footer class="credits">
        Data from <a href="https://ftcscout.org" target="_blank" rel="noopener">FTCScout</a> and the
        <a href="https://ftc-events.firstinspires.org/services/API" target="_blank" rel="noopener">FTC Events API</a>.
        Locations are approximate (city level for teams).
        <span id="generated"></span>
      </footer>
    </div>
  </aside>

  <main id="map" aria-label="Map of FTC teams and events"></main>
  <div id="legend" class="legend" aria-label="Legend"></div>
  <div id="loading" class="loading" role="status">Loading map data…</div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
